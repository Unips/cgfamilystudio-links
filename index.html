@font-face { font-family: "Bebas Neue"; src: url("BebasNeue-Regular.ttf") format("truetype"); font-display: swap; }
:root { --bg: #1E2B3C; --surface: #243349; --line: #34465F; --accent: #9D00FF; --text: #F8F9FA; --muted: #B8C4D5; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.45 "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 480px; margin: 0 auto; padding: 28px 16px 40px; display: flex; flex-direction: column; gap: 20px; }
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
header { text-align: center; }
header img { width: 84px; height: 84px; }
h1, h2 { font-family: "Bebas Neue", sans-serif; font-weight: 400; letter-spacing: .5px; margin: 0; }
h1 { font-size: 40px; margin-top: 6px; }
h2 { font-size: 24px; margin-bottom: 10px; }
.lead { color: var(--muted); margin: 2px 0 0; font-size: 15px; }
.reels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.reel { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rc { flex: 1; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; overflow: hidden; }
.rc img, .noimg { display: block; width: 100%; height: auto; aspect-ratio: 9 / 16; object-fit: cover; background: #2B3D55; }
.cap { margin: 6px 8px 8px; font-size: 12.5px; line-height: 1.3; overflow-wrap: anywhere; display: -webkit-box;
  -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.full { font-size: 12.5px; font-weight: 700; color: var(--text); text-align: center; padding: 6px 4px;
  border-radius: 8px; border: 1px solid var(--accent); }
.prod { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
.prod img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; }
.pb { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 6px; }
.pb h3 { margin: 0; font-size: 17px; line-height: 1.3; overflow-wrap: anywhere; }
.price { margin: 0; color: var(--muted); font-weight: 600; }
.buy { display: block; text-align: center; padding: 12px; border-radius: 10px; background: var(--accent);
  font-weight: 700; color: #FFFFFF; }
.sub { color: var(--muted); font-size: 14px; text-align: center; text-decoration: underline; text-underline-offset: 2px; }
.btn { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border-radius: 12px; background: var(--surface);
  border: 1px solid var(--line); }
.rc:hover, .prod:hover, .btn:hover { border-color: var(--accent); }
.bl { font-weight: 700; }
.bn { color: var(--muted); font-size: 14px; }
footer nav { display: flex; justify-content: center; gap: 14px; }
footer nav a { display: inline-flex; width: 48px; height: 48px; align-items: center; justify-content: center;
  border-radius: 50%; background: var(--surface); border: 1px solid var(--line); }
footer nav a:hover { border-color: var(--accent); }
footer svg { width: 22px; height: 22px; fill: var(--text); }
